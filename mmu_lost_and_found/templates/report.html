<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Found Item</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            background: #101a33;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title p {
            color: #697386;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce1e8;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #e31b23;
        }

        .submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #e31b23;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit:hover {
            background: #c9141b;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <i class="fa-solid fa-magnifying-glass"></i>
            MMU Lost & Found
        </div>

        <a href="{{ url_for('dashboard') }}" class="back">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>

    </nav>


    <div class="container">

        <div class="title">

            <h1>Report Found Item</h1>

            <p>
                Fill in the details below to report an item found on campus.
            </p>

        </div>


        <div class="form-card">

            <form action="{{ url_for('add_found_item') }}"
                  method="POST"
                  enctype="multipart/form-data">


                <div class="form-group">

                    <label>Item Name</label>

                    <input
                        type="text"
                        name="item_name"
                        placeholder="Example: Black Wallet"
                        required>

                </div>


                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        name="description"
                        placeholder="Describe the item..."
                        required></textarea>

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <select name="category" required>

                        <option value="">Select category</option>

                        <option>Wallet</option>
                        <option>Phone</option>
                        <option>Laptop</option>
                        <option>Bag</option>
                        <option>Keys</option>
                        <option>Student Card</option>
                        <option>Earphones</option>
                        <option>Other</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Found Location</label>

                    <input
                        type="text"
                        name="location"
                        placeholder="Example: MMU Library"
                        required>

                </div>


                <div class="form-group">

                    <label>Date Found</label>

                    <input
                        type="date"
                        name="date"
                        required>

                </div>


                <div class="form-group">

                    <label>Item Image</label>

                    <input
                        type="file"
                        name="image"
                        accept="image/*">

                </div>


                <button type="submit" class="submit">

                    <i class="fa-solid fa-plus"></i>
                    Report Found Item

                </button>


            </form>

        </div>

    </div>

</body>

</html>
