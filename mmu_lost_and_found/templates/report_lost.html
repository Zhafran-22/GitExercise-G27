<!DOCTYPE html>
<html>
<head>
    <title>Report Lost Item - MMU Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Report Lost Item</h1>

    <form method="POST">

        <label>Item Name:</label>
        <br>
        <input type="text" name="item_name" required>

        <br><br>

        <label>Description:</label>
        <br>
        <textarea name="description" required></textarea>

        <br><br>

        <label>Category:</label>
        <br>
        <select name="category" required>
            <option value="">Select Category</option>
            <option value="Electronics">Electronics</option>
            <option value="Personal Items">Personal Items</option>
            <option value="Documents">Documents</option>
            <option value="Wallet">Wallet</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label>Location:</label>
        <br>
        <select name="location" required>
            <option value="">Select Location</option>
            <option value="Faculty of Computing & Informatics (FCI)">Faculty of Computing & Informatics (FCI)</option>
            <option value="Central Library">Central Library</option>
            <option value="Cafeteria">Cafeteria</option>
            <option value="Learning Point">Learning Point</option>
            <option value="Hostel">Hostel</option>
            <option value="Classroom">Classroom</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label>Date Lost:</label>
        <br>
        <input type="date" name="date" required>

        <br><br>

        <button type="submit">Submit Lost Item</button>

    </form>

    <br>

    <a href="/lost-items">
        <button>Back to Lost Items</button>
    </a>

</body>
</html>
