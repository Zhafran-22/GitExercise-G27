<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}{% endblock %} | MMU Lost & Found
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .navbar {
            height: 70px;
            background: #101a33;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #e31b23;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
        }

        .nav-links {
            display: flex;
            gap: 22px;
        }

        .navbar a {
            color: #c8cfdd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto 70px;
            padding: 0 20px;
        }

        .page-head h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .page-head p {
            color: #697386;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .panel {
            background: white;
            border: 1px solid #edf0f5;
            border-radius: 14px;
            padding: 26px;
            margin-bottom: 22px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        .panel h2 {
            font-size: 19px;
            margin-bottom: 16px;
        }

        .flash {
            padding: 13px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        .flash.success {
            background: #e8f6ee;
            color: #146c3a;
            border: 1px solid #bfe6cf;
        }

        .flash.error {
            background: #fdecec;
            color: #a3141b;
            border: 1px solid #f5c2c4;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d9deea;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #e31b23;
            outline-offset: 1px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-grid .full {
            grid-column: 1 / -1;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 2fr 1.3fr 1.3fr auto;
            gap: 12px;
            align-items: end;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 9px;
            background: #e31b23;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #c9141b;
        }

        .btn.ghost {
            background: #eef1f7;
            color: #172033;
        }

        .btn.ghost:hover {
            background: #e1e6f0;
        }

        .btn.green {
            background: #1f9d55;
        }

        .btn.green:hover {
            background: #178246;
        }

        .btn.small {
            padding: 8px 14px;
            font-size: 13px;
        }

        .item {
            background: white;
            border: 1px solid #edf0f5;
            border-left: 5px solid #e31b23;
            border-radius: 12px;
            padding: 20px 22px;
            margin-bottom: 14px;
        }

        .item h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .item p {
            font-size: 14px;
            color: #4b566b;
            line-height: 1.6;
        }

        .meta {
            color: #697386;
            font-size: 13px;
            margin-top: 6px;
        }

        .item-row {
            display: flex;
            gap: 18px;
            justify-content: space-between;
            align-items: flex-start;
        }

        .thumb {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .inline-form {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            align-items: center;
        }

        .inline-form select {
            width: auto;
        }

        .empty {
            text-align: center;
            padding: 36px 20px;
            color: #697386;
            background: white;
            border: 1px dashed #d9deea;
            border-radius: 12px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #eef1f7;
            color: #4b566b;
        }

        .badge.Lost,
        .badge.Rejected {
            background: #fdecec;
            color: #a3141b;
        }

        .badge.Found,
        .badge.Pending {
            background: #fff4dc;
            color: #8a5a00;
        }

        .badge.Claimed,
        .badge.Accepted {
            background: #e8f6ee;
            color: #146c3a;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 12px;
                font-size: 12px;
            }

            .brand {
                display: none;
            }

            .form-grid,
            .filter-grid {
                grid-template-columns: 1fr;
            }

            .item-row {
                flex-direction: column;
            }
        }

        {% block extra_css %}{% endblock %}

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="brand">

            <div class="brand-mark">
                L
            </div>

            MMU Lost & Found

        </div>

        <div class="nav-links">

            <a href="{{ url_for('matching.overview') }}">
                Overview
            </a>

            <a href="{{ url_for('matching.lost_items') }}">
                Lost Items
            </a>

            <a href="{{ url_for('matching.view_matches') }}">
                Matches
            </a>

            <a href="{{ url_for('matching.manage_claims') }}">
                Claims
            </a>

            <a href="{{ url_for('matching.overview') }}">
                ← Main Menu
            </a>

        </div>

    </nav>

    <main class="container">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}

        {% block content %}{% endblock %}

    </main>

</body>

</html>
